name: Build, test and prepare release
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - name: Restore and audit all .NET dependencies
        run: dotnet restore IncidentResponseAgent.slnx
      - run: dotnet build IncidentResponseAgent.slnx -c Release --no-restore
      - run: dotnet test IncidentResponseAgent.slnx -c Release --no-build --logger trx
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Deterministic browser flows (no provider credentials)
        run: npm run test:e2e -- --retries=0
      - name: Validate version tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=1.0.0
          if [ "$REF_TYPE" = tag ]; then
            [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected vMAJOR.MINOR.PATCH'; exit 1; }
            version="${REF_NAME#v}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: docker build --build-arg VERSION="$VERSION" -t incident-response-agent:local .
      - name: Compose smoke test with empty provider credentials
        env:
          VERSION: local
        run: |
          docker compose up -d --no-build
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health > health.json; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8080/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ready)" = 401
          test "$(docker compose exec -T app id -u)" != 0
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/projects)" = 401
          docker compose restart app
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8080/health
      - name: Scan container and repository secrets
        run: |
          docker save incident-response-agent:local -o image.tar
          docker run --rm -v "$PWD:/scan:ro" aquasec/trivy:0.74.0 image --input /scan/image.tar --scanners vuln --severity HIGH,CRITICAL --exit-code 1
          docker run --rm -v "$PWD:/scan:ro" aquasec/trivy:0.74.0 fs --scanners secret --exit-code 1 --skip-dirs /scan/node_modules,/scan/.git,/scan/.tmp --skip-files /scan/image.tar /scan
      - name: Prepare version-tag artifact (no registry push or deployment)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gzip image.tar
          sha256sum image.tar.gz > image.tar.gz.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: incident-response-agent-${{ github.ref_name }}
          path: |
            image.tar.gz
            image.tar.gz.sha256
            docs/deployment.md
          retention-days: 14
      - name: Stop local test containers
        if: always()
        run: docker compose down
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: verification-results
          path: |
            **/TestResults/*.trx
            playwright-report/
            health.json
          retention-days: 7

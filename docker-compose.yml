services:
  app:
    build:
      context: .
      args:
        VERSION: ${VERSION:-1.0.0}
    image: incident-response-agent:${VERSION:-local}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      AllowedHosts: ${ALLOWED_HOSTS:-localhost;127.0.0.1}
      Authentication__Authority: ${AUTHORITY:-https://identity.example.invalid}
      Authentication__Audience: ${AUDIENCE:-https://incident-response-agent-api}
      Authentication__BrowserClientId: ${BROWSER_CLIENT_ID:-}
      Authentication__BrowserClientSecret: ${BROWSER_CLIENT_SECRET:-}
      Authentication__RequiredScope: ${REQUIRED_SCOPE:-incident_response}
      Authentication__AllowDevelopmentIdentity: "false"
      Agent__IncidentAnalysis__ApiKey: ${OPENROUTER_API_KEY:-}
      Agent__IncidentAnalysis__Endpoint: ${OPENROUTER_ENDPOINT:-https://openrouter.ai/api/v1}
      Agent__IncidentAnalysis__Model: ${OPENROUTER_MODEL:-liquid/lfm-2.5-2.6b:free}
      Runbooks__SemanticRetrieval__EmbeddingProvider: ${EMBEDDING_PROVIDER:-HuggingFace}
      Runbooks__SemanticRetrieval__ApiKey: ${EMBEDDING_API_KEY:-}
      Runbooks__SemanticRetrieval__Endpoint: ${EMBEDDING_ENDPOINT:-https://router.huggingface.co/hf-inference/models/}
      Runbooks__SemanticRetrieval__Model: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      Runbooks__SemanticRetrieval__QdrantEndpoint: http://qdrant:6333
      Monitoring__Enabled: "false"
      # Local loopback smoke tests use HTTP. Enable for deployment behind a trusted TLS proxy.
      Security__HttpsRedirection: ${HTTPS_REDIRECTION:-false}
    volumes:
      - app_state:/state
      - protection_keys:/keys
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on: [qdrant]
    mem_limit: 1g
    cpus: 2
  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    # No host port: only the app's Docker network can reach Qdrant.
    volumes:
      - qdrant_storage:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 1
volumes:
  app_state:
  protection_keys:
  qdrant_storage:
  qdrant_snapshots:
